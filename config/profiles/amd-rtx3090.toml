# StickLLM v0.1 — sole supported hardware profile
# Do not add other GPUs until this profile boots and serves stably.

id = "amd-rtx3090"
name = "AMD desktop + NVIDIA RTX 3090 (24 GB)"
version = "0.3.0"

[host]
cpu_vendor = "amd"
arch = "x86_64"
min_ram_gb = 32
uefi = true
secure_boot = "must_disable"  # proprietary NVIDIA modules are unsigned for this MVP

[gpu]
vendor = "nvidia"
model = "GeForce RTX 3090"
vram_gb = 24
min_driver = "535"
cuda_arch = "sm_86"  # Ampere

[inference]
engine = "llama.cpp"
binary = "/opt/stickllm/bin/llama-server"
host = "127.0.0.1"  # LAN goes through TLS gateway
port = 8080
ctx_size = 8192
n_gpu_layers = -1  # offload all layers to GPU
threads = 8

[model]
# Baked lite default: Qwen2.5-VL-3B + mmproj. Preferred on 24 GB: Qwen3.8-27B + mmproj (catalog download).
# Runtime selection: stickllm-select-model + config/models/catalog.toml
filename = "Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf"
hf_repo = "ggml-org/Qwen2.5-VL-3B-Instruct-GGUF"
hf_files = [
  "Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf",
  "mmproj-Qwen2.5-VL-3B-Instruct-Q8_0.gguf",
]
approx_size_gb = 2.8
preferred_id = "qwen38-27b-q4km"
sha256 = [
  "d02fe9b69ad8cadbbd228e387667af66612c44bed29ffc8eb1e7caf9ac486c12",
  "980c9b2f78c04e6cff93d277ada09e768394f112d75db3b4e9dea8a69f9fb904",
]

[ui]
bind = "0.0.0.0"
port = 443
http_redirect_port = 80
path = "/opt/stickllm/ui"
chat_frontend = "native"

[privacy]
default_mode = "ephemeral"
persist_requires_explicit_approval = true
write_internal_disks = false
cloud = false
telemetry = false

[network]
lan_api = true
tls = true  # v0.3: self-signed HTTPS on :443 (HTTP :80 redirects)
outbound_required = false
