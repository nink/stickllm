# StickLLM GRUB — load Debian live modules first, then our menu.
# Replacing the stock menu without sourcing config.cfg breaks video/USB root on some boards.

source /boot/grub/config.cfg

insmod part_gpt
insmod part_msdos
insmod iso9660
insmod fat
insmod ext2
insmod search_fs_file
insmod linux
insmod gzio
insmod echo

search --no-floppy --set=root --file /.disk/info

set default=0
set timeout=12

# Common AMD desktop USB quirks: keep console visible (no quiet).
# nvidia proprietary modules can hang early; failsafe blacklists them.

menuentry "StickLLM ephemeral (amd-rtx3090) [default]" {
    linux /live/vmlinuz boot=live components username=user hostname=stickllm noeject console=tty0 ---
    initrd /live/initrd.img
}

menuentry "StickLLM ephemeral (verbose / debug)" {
    linux /live/vmlinuz boot=live components username=user hostname=stickllm noeject debug ignore_uuid console=tty0 ---
    initrd /live/initrd.img
}

menuentry "StickLLM failsafe (nomodeset, blacklist nvidia)" {
    linux /live/vmlinuz boot=live components username=user hostname=stickllm noeject nomodeset modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm console=tty0 ---
    initrd /live/initrd.img
}

menuentry "StickLLM with persistence (only after stickllm-persist)" {
    linux /live/vmlinuz boot=live components username=user hostname=stickllm noeject persistence persistence-label=STICKLLM-DATA console=tty0 ---
    initrd /live/initrd.img
}
