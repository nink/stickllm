# StickLLM GRUB — short menu for small displays.
source /boot/grub/config.cfg

insmod part_gpt
insmod part_msdos
insmod iso9660
insmod fat
insmod ext2
insmod search_fs_file
insmod linux
insmod gzio

search --no-floppy --set=root --file /.disk/info

set default=0
set timeout=8

menuentry "1 StickLLM" {
    linux /live/vmlinuz boot=live components ignore_uuid username=user hostname=stickllm noeject console=tty0 loglevel=4 ---
    initrd /live/initrd.img
}

menuentry "2 StickLLM local chat" {
    linux /live/vmlinuz boot=live components ignore_uuid username=user hostname=stickllm noeject stickllm.local console=tty0 loglevel=4 ---
    initrd /live/initrd.img
}

menuentry "3 StickLLM terminal + SSH" {
    linux /live/vmlinuz boot=live components ignore_uuid username=user hostname=stickllm noeject stickllm.ssh console=tty0 loglevel=4 ---
    initrd /live/initrd.img
}

menuentry "4 StickLLM failsafe" {
    linux /live/vmlinuz boot=live components ignore_uuid nomodeset modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm username=user hostname=stickllm noeject stickllm.ssh console=tty0 ---
    initrd /live/initrd.img
}
